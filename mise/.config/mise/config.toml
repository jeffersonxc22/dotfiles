# Só o que ainda é usado nesta máquina: o gerador de CLI `usage`.
[tools]
usage = { version = "latest", workflow = "publish-cli.yml" }
go = "latest"
node = "24"
python = "3"
java = "25"
gcloud = "latest"
maven = "latest"
rust = "latest"

[env]
HIVEMIND_VAULT_PATH = "{{env.HOME}}/Áreas/Documentos/hivemind"
