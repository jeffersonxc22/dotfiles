<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Gerenciado pelos dotfiles (stow). Fonte padrão para apps fora do KDE
     (GTK, Chrome/Electron, Flatpak): Inter para texto, Cascadia Mono NF para mono. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Cascadia Mono NF</family></prefer>
  </alias>
</fontconfig>
