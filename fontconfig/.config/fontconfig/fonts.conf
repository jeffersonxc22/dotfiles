<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Gerenciado pelos dotfiles (stow). Fonte padrão para apps fora do KDE
     (GTK, Chrome/Electron, Flatpak): Geist para texto, GeistMono Nerd Font para mono. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>GeistMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
