# Perfil da placa Intel (alsa_card.pci-0000_00_1f.3) com as caixas/fones do
# notebook E as saídas HDMI/DisplayPort (monitores Odyssey G5) ao mesmo tempo.
# O perfil padrão do ACP só deixa usar uma das duas. Aplicado por
# ~/.config/wireplumber/wireplumber.conf.d/intel-analog-plus-hdmi.conf.
# Só as duas saídas que têm monitor (as HDMI 3/4 ficavam vazias e apareciam
# na troca de saída do Omarchy). Mapeamentos copiados de /usr/share/alsa-card-profile/mixer/profile-sets/default.conf.

[General]
auto-profiles = no

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output analog-output-lineout analog-output-speaker analog-output-headphones analog-output-headphones-2
paths-input = analog-input-front-mic analog-input-rear-mic analog-input-internal-mic analog-input-dock-mic analog-input analog-input-mic analog-input-linein analog-input-aux analog-input-video analog-input-tvtuner analog-input-fm analog-input-mic-line analog-input-headphone-mic analog-input-headset-mic
priority = 15

[Mapping hdmi-stereo]
description = Monitor do meio (Odyssey G5)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = left,right
priority = 9
direction = output

[Mapping hdmi-stereo-extra1]
description = Monitor da direita (Odyssey G5)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = left,right
priority = 7
direction = output

[Profile output:analog-stereo+output:hdmi-all+input:analog-stereo]
description = Notebook + monitores (HDMI/DisplayPort)
output-mappings = analog-stereo hdmi-stereo hdmi-stereo-extra1
input-mappings = analog-stereo
priority = 7000
skip-probe = yes
