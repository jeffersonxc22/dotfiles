## Placa Intel: caixas do notebook e som dos monitores (DisplayPort) juntos,
## para o Omarchy listar todos como saídas (Super+Ctrl+... / omarchy audio output switch).
## Perfil em ~/.config/alsa-card-profile/intel-analog-plus-hdmi.conf.
## Para desfazer: apague os dois arquivos e rode systemctl --user restart wireplumber.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.profile-set = "/home/jefferson/.config/alsa-card-profile/intel-analog-plus-hdmi.conf"
        device.profile = "output:analog-stereo+output:hdmi-all+input:analog-stereo"
      }
    }
  }
]
