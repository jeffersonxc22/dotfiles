onboarding = false

# O Herdr tem temas próprios; usamos o catppuccin para não depender de a
# paleta ANSI do terminal estar disponível na UI.
[theme]
name = "catppuccin"
dark_name = "catppuccin"
light_name = "catppuccin-latte"
auto_switch = false

[keys]
prefix = "ctrl+space"
new_tab = "prefix+n"
next_tab = "prefix+tab"
# prefix+tab agora é próxima aba; o ciclo inverso fica em prefix+shift+tab.
cycle_pane_next = ""
close_tab = "prefix+q"
detach = "prefix+d"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sound]
enabled = true

[experimental]
switch_ascii_input_source_in_prefix = false
pane_history = true
