[ids]
# MX Mechanical Mini
046d:b367
# MX Keys Mini (mesmo layout físico US ANSI)
046d:b369

[main]
# Aproxima as posições US International sobre o layout XKB brasileiro.
leftbrace = rightbrace
rightbrace = backslash
backslash = 102nd
semicolon = slash
slash = ro
grave = S-leftbrace
apostrophe = leftbrace

[shift]
grave = apostrophe
apostrophe = S-6
6 = S-apostrophe

[altgr]
comma = semicolon

[altgr+shift]
comma = S-semicolon
