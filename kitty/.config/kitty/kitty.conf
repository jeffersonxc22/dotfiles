# ~/.config/kitty/kitty.conf
# Gerenciado pelos dotfiles (stow).
#
# As cores ANSI vêm do tema Catppuccin do flavour atual e o fundo/texto/accent
# são gerados a partir do kdeglobals por theme/kitty-colors.sh em
# ~/.cache/dotfiles/kitty-theme.conf.

# Fonte
font_family Cascadia Mono NF
bold_font auto
italic_font auto
bold_italic_font auto
font_size 16
disable_ligatures never

# Cursor: beam com rastro/stretch (mesmo comportamento do Ryoku).
cursor_shape beam
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 0

# Janela
background_opacity 1.0
background_blur 0
dynamic_background_opacity yes
window_padding_width 10
confirm_os_window_close 0
remember_window_size yes
mouse_hide_wait 2
scrollback_lines 5000

# Comportamento
copy_on_select clipboard
enable_audio_bell no
update_check_interval 0
allow_remote_control no

# Fallback: Catppuccin Mocha + Sapphire. O include abaixo sobrescreve.
background #1e1e2e
foreground #cdd6f4
cursor #74c7ec
cursor_text_color #1e1e2e
selection_background #45475a
selection_foreground #cdd6f4

# Gerenciado por theme/kitty-colors.sh; ausente até o primeiro apply.
globinclude ../../.cache/dotfiles/kitty-theme.conf
